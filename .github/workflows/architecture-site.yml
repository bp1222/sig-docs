name: architecture-site

# Publishes the prebuilt site/ directory to GitHub Pages. The site is built in
# bp1222/sig and committed here; nothing is built in this repository.
# Pages must be enabled once: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/architecture-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
