name: architecture-site

# Builds the LikeC4 architecture site and, on master, publishes it to GitHub
# Pages. Pages must be enabled once: Settings -> Pages -> Source: GitHub Actions.
#
# The generator reads the public headers of bp1222/sig, which is checked out
# next to this repo. If bp1222/sig is private, add a read-only token for it as
# the SIG_READ_TOKEN secret. To rebuild when the headers change, have bp1222/sig
# send a repository_dispatch event of type sig-updated to this repo.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [sig-updated]

permissions:
  contents: read

concurrency:
  group: architecture-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SIG_ROOT: ${{ github.workspace }}/sig-src

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: bp1222/sig
          path: sig-src
          token: ${{ secrets.SIG_READ_TOKEN || github.token }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.6.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.3
          cache: pnpm
      - name: sigdoc tests
        run: node --test tools/sigdoc/test/
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
